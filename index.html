<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的英文滑讀</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f9;--fg:#14202b;--muted:#5b6874;--card:#fff;--line:#dde4ea;--mark:#ffe27a;--markfg:#3b2f00;--acc:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--fg:#e8edf2;--muted:#9aa8b5;--card:#17222d;--line:#2a3846;--mark:#6b5600;--markfg:#fff3c4;--acc:#5eead4}}
:root[data-theme="dark"]{--bg:#0f1720;--fg:#e8edf2;--muted:#9aa8b5;--card:#17222d;--line:#2a3846;--mark:#6b5600;--markfg:#fff3c4;--acc:#5eead4}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;font-size:13px;color:var(--muted);flex:none}
header b{color:var(--fg);font-size:15px}
#feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
section{min-height:100%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:18px 22px;max-width:640px;margin:0 auto;box-sizing:border-box}
h2{font-family:Lora,Georgia,serif;font-size:24px;line-height:1.25;margin:0 0 4px}
.zh{color:var(--muted);font-size:16px;margin:0 0 8px}
.meta{font-size:12px;color:var(--muted);margin:0 0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.new{background:var(--acc);color:var(--bg);border-radius:99px;padding:1px 8px;font-weight:700}
.body{font-family:Lora,Georgia,serif;font-size:19px;line-height:1.85}
.w{cursor:pointer;border-radius:3px;padding:0 1px}
.w:hover,.w.on{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.w.t{background:var(--mark);color:var(--markfg)}
.act{margin-top:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
a{color:var(--acc)}
button,input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button{cursor:pointer}
button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible,.w:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.18);max-width:640px;margin:0 auto;border-radius:14px 14px 0 0}
.sheet[hidden],.full[hidden]{display:none}
#sw{font-family:Lora,Georgia,serif;font-size:26px;font-weight:600}
#sm{font-size:18px;margin:6px 0 10px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.t{background:var(--mark);color:var(--markfg);border-color:transparent}
.full{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 30px;z-index:5}
.full>div{max-width:560px;margin:0 auto}
.full label{display:block;margin:14px 0 4px;font-size:13px;color:var(--muted)}
.full input,.full select{width:100%;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.vr{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.vr b{font-family:Lora,Georgia,serif;font-size:16px;min-width:84px}
.vr span{flex:1;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
header{order:0}#feed{order:1}
.sheet{position:static;order:2;width:100%;max-width:640px;align-self:center;box-sizing:border-box;padding:14px 20px;box-shadow:none;border-radius:14px 14px 0 0}
#feed.pin{scroll-snap-type:none}
#stat{order:3;width:100%;max-width:640px;align-self:center;box-sizing:border-box;max-height:45vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);padding:6px 18px 10px}
#stat[hidden]{display:none}
footer{order:4}
#eng{background:none;border:0;padding:4px 0;color:var(--muted);font-size:13px}
.sh{font-size:12px;color:var(--muted);margin:10px 0 3px}
.sr{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0}
.sr b{font-weight:500;text-align:right}
</style>
</head>
<body>
<header><b>我的英文滑讀</b><span id="st"></span><span><button id="bi">來源</button> <button id="bv">單字本</button> <button id="bs">設定</button></span></header>
<main id="feed"><section id="more"><h2>下一篇準備中</h2><p class="zh" id="mt">讀取最新資料中…</p><div class="row"><button id="gb">立即生成一篇</button></div><div id="hn" style="margin-top:18px"></div></section></main>
<div id="stat" hidden><div id="sg"></div></div>
<footer><button id="eng" aria-expanded="false"></button><span>上滑看下一篇，點單字看意思</span></footer>

<div id="sheet" class="sheet" hidden><div id="sw"></div><div id="sm"></div><span id="stg" class="tag"></span> <button id="cl" style="float:right">關閉</button></div>

<div id="pset" class="full" hidden><div>
  <h2>設定</h2>
  <label>Gemini API 金鑰（只存在這個瀏覽器）</label><input id="ck" type="password" autocomplete="off" placeholder="貼上金鑰">
  <label>模型名稱</label><input id="cm">
  <label>備用模型（主模型忙碌時改用，可留空）</label><input id="cm2">
  <label>每日 API 上限（選填，只用來顯示，例如 12 / 20）</label><input id="climit" type="number" min="0">
  <label>想看的主題（可多選）</label><div class="chips" id="ct"></div>
  <label>來源範圍</label><select id="cst"><option value="1">只用授權明確的來源（建議）</option><option value="0">也顯示授權未確認的來源</option></select>
  <label>難度</label><select id="cd"><option value="0">簡單</option><option value="1">普通</option><option value="2">挑戰</option></select>
  <label>文章長度</label><select id="cg"><option value="0">短（約 60 字）</option><option value="1">中（約 100 字）</option><option value="2">長（約 150 字）</option></select>
  <div class="row"><button id="cs" class="on">儲存並關閉</button></div>
</div></div>

<div id="pimp" class="full" hidden><div>
  <h2>匯入單字</h2>
  <label>清單名稱</label><input id="impName">
  <label>貼上單字：每行一個，可寫「單字, 中文」；也可直接貼大考中心詞彙表的文字，會自動辨識</label>
  <textarea id="impText" style="width:100%;height:140px;box-sizing:border-box"></textarea>
  <input type="file" id="impFile" accept=".txt,.csv" style="margin-top:6px">
  <label>匯入後的狀態</label><select id="impDest"><option value="learning">學習中</option><option value="known">已會（不會出現）</option><option value="ignore">不想學（不會出現）</option></select>
  <p id="impPrev" style="font-size:13px;color:var(--muted)"></p>
  <div class="row"><button id="impPv">預覽</button><button id="impOk" class="on">匯入</button><button id="impX">關閉</button></div>
  <div id="impList"></div>
</div></div>

<div id="pinfo" class="full" hidden><div>
  <h2>來源與授權</h2>
  <div id="il"></div>
  <p style="font-size:13px;color:var(--muted)">改寫自維基百科的文章，請依 CC BY-SA 4.0 標示來源並以相同方式分享，文章底下的連結即為來源標示。標示「授權未確認」的來源預設不顯示。本 App 讀到的資料只當作事實來源，文章由 Gemini 改寫，仍可能有誤，請對照原文。</p>
  <div class="row"><button id="ic" class="on">關閉</button></div>
</div></div>

<div id="pvoc" class="full" hidden><div>
  <h2>單字本</h2>
  <p id="vs" style="font-size:13px;color:var(--muted)"></p>
  <div class="row"><input id="vn" placeholder="新增想學的單字（英文）" style="flex:1"><button id="va">加入單字池</button></div>
  <div class="row"><select id="vf" style="width:auto"><option value="all">全部</option><option value="learning">學習中</option><option value="familiar">熟悉</option><option value="mastered">已掌握</option><option value="known">已會</option><option value="ignore">不想學</option></select><button id="vi">匯入單字</button></div>
  <div id="vl"></div>
  <div class="row"><button id="ve">複製點擊紀錄 JSON</button><button id="vx">清空全部資料</button><button id="vc" class="on">關閉</button></div>
  <textarea id="vj" readonly hidden style="width:100%;height:100px;margin-top:8px"></textarea>
</div></div>

<script>
const $=i=>document.getElementById(i);
const h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);k.flat().forEach(x=>e.append(x));return e};
const BASE="answer begin brave bridge careful choose clever collect dangerous decide defeat different early enemy escape explore famous finally follow future gather guide hidden honest important invite journey kind laugh lesson local mistake modern narrow notice offer ordinary perfect plan protect quiet reach reward safe search secret share simple special strange strong surprise travel useful village wander warn wonder worth".split(" ");
const TOPICS=["國際","科技","科技人物","遊戲版本","遊戲攻略","遊戲劇情"];
const LV=["very easy: sentences under 10 words, only the most basic vocabulary","easy: sentences mostly under 15 words","moderate: a mix of short and longer sentences, with a few when/if/that clauses"],LN=[60,100,150];
let D={articles:[],state:{},extra:[],taps:[],used:[],days:{},calls:{},cm:{},out:{},lists:[],flags:{},top:{},off:0,hist:[],ex:{},cfg:{key:"",model:"gemini-3.5-flash-lite",model2:"gemini-3.1-flash-lite",topics:["國際","科技"],level:1,len:1,strict:1}};
try{const s=JSON.parse(localStorage.getItem("reel_v2"));if(s)D={...D,...s,cfg:{...D.cfg,...s.cfg}}}catch(e){}
if(D.cfg.model2==="gemini-2.5-flash-lite")D.cfg.model2="gemini-3.1-flash-lite";
const save=()=>{try{localStorage.setItem("reel_v2",JSON.stringify(D))}catch(e){}};
const feed=$("feed"),sents=t=>t.split(/(?<=[.!?])\s+/);
let SRC=[],busy=false,failed=false,cur=-1,UPD="";
function drawHN(l){
  const box=$("hn");
  if(!l.length){box.replaceChildren();return}
  box.replaceChildren(
    h("p",{className:"meta",textContent:"今日科技圈在談什麼（Hacker News 熱門，僅列標題與連結）"}),
    ...l.map(x=>{
      const ok=/^https?:\/\//.test(x.url||"");
      return h("div",{className:"vr"},
        ok?h("a",{href:x.url,target:"_blank",rel:"noopener",textContent:x.title}):h("span",{textContent:x.title}),
        h("span",{textContent:x.score+" 分 · "+x.comments+" 則留言",style:"flex:none;font-size:12px"}));
    }));
}
const say=t=>{$("st").textContent=t;$("mt").textContent=t||"向上滑動看下一篇"};
const fd=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const ago=t=>{const m=(Date.now()-Date.parse(t))/6e4;return m<60?Math.max(1,Math.round(m))+" 分鐘前":m<1440?Math.round(m/60)+" 小時前":Math.round(m/1440)+" 天前"};
function eng(){
  let d=new Date();if(!D.days[fd(d)])d.setDate(d.getDate()-1);
  let n=0;while(D.days[fd(d)]){n++;d.setDate(d.getDate()-1)}
  $("eng").textContent=(n?"連續 "+n+" 天 · ":"")+"今日 "+(D.days[fd(new Date())]||0)+" 篇 · API "+(D.calls[fd(new Date())]||0)+" 次 "+($("stat").hidden?"▴":"▾");if(!$("stat").hidden)drawStat();
}

let WORDS=[];
fetch("data/ceec-words.json").then(r=>r.json()).then(j=>{for(const lv in j.levels)for(const e of j.levels[lv].w){const p=e.split("|");WORDS.push({w:p[0],pos:p[1],lv:+lv})}}).catch(()=>{});
const effLv=()=>Math.max(0,Math.min(2,D.cfg.level+Math.round(D.off)));
const cap=()=>1+effLv();
const stat=w=>{const s=D.state[w];if(!s||(!s.shown&&!s.taps))return"new";if(s.shown>=6&&(s.miss||0)>=5)return"mastered";if(s.shown>=3&&(s.miss||0)>=3)return"familiar";return"learning"};
const mean=w=>{for(const l of D.lists)for(const x of l.words)if(x.w===w&&x.m)return x.m;return""};
function cands(){
  const c=cap(),seen=new Set(),out=[];
  const add=(w,lv)=>{if(seen.has(w)||D.flags[w]||!/^[a-z][a-z'-]+$/.test(w))return;seen.add(w);out.push({w,lv})};
  D.lists.filter(l=>l.on).forEach(l=>l.words.forEach(x=>add(x.w,0)));
  (WORDS.length?WORDS.filter(x=>x.lv<=c):BASE.map(w=>({w,lv:1}))).forEach(x=>add(x.w,x.lv));
  D.extra.forEach(w=>add(w,0));
  return out;
}
function draw(arr,k,wf){
  const o=[],a=[...arr];
  while(o.length<k&&a.length){let r=Math.random()*a.reduce((t,x)=>t+wf(x),0),i=0;for(;i<a.length-1;i++){r-=wf(a[i]);if(r<=0)break}o.push(a.splice(i,1)[0])}
  return o;
}
function pick(n){
  const g={new:[],learning:[],review:[]};
  cands().forEach(x=>{const s=stat(x.w);g[s==="new"?"new":s==="learning"?"learning":"review"].push(x)});
  const wl=x=>1+2*((D.state[x.w]||{}).taps||0);
  let out=[...draw(g.learning,3,wl),...draw(g.new,1,x=>1/(1+x.lv)),...draw(g.review,1,()=>1)];
  const rest=[...g.learning,...g.new,...g.review].filter(x=>!out.includes(x));
  out=out.concat(draw(rest,n-out.length,wl));
  return out.map(x=>x.w);
}
const nrm=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
function gam(k){
  if(k<1)return gam(k+1)*Math.pow(Math.random(),1/k);
  const d=k-1/3,c=1/Math.sqrt(9*d);
  for(;;){let x,v;do{x=nrm();v=1+c*x}while(v<=0);v=v*v*v;const u=Math.random();if(u<1-.0331*x**4||Math.log(u)<.5*x*x+d*(1-v+Math.log(v)))return d*v}
}
const beta=(a,b)=>{const x=gam(a),y=gam(b);return x/(x+y)};
function pickSrc(ts){
  let c=SRC.filter(s=>ts.includes(s.topic)&&!D.used.includes(s.id)&&(!+D.cfg.strict||s.ok!==false));
  if(!c.length)return null;
  const last=D.articles.slice(-2).map(a=>a.topic);
  if(last.length===2&&last[0]===last[1]){const o=c.filter(s=>s.topic!==last[0]);if(o.length)c=o}
  if(Math.random()<.15)return c[Math.floor(Math.random()*c.length)];
  const th={};ts.forEach(t=>{const p=D.top[t]||{a:2,b:1};th[t]=beta(p.a,p.b)});
  const ws=c.map(s=>{const age=s.date?Math.max(0,(Date.now()-Date.parse(s.date))/864e5):3;return(th[s.topic]||.5)/(1+age)});
  let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;for(;i<c.length-1;i++){r-=ws[i];if(r<=0)break}
  return c[i];
}
function finish(a){
  if(a.done||!a.seen)return;a.done=1;
  const wc=toks(a.text).length||60,exp=Math.max(8,wc/2.5),sec=a.dwell||0,tp=new Set(a.tp||[]);
  Object.keys(a.tmap||{}).forEach(b=>{const s=D.state[b]=D.state[b]||{shown:0,taps:0};s.miss=tp.has(b)?0:(s.miss||0)+1});
  const p=D.top[a.topic]=D.top[a.topic]||{a:2,b:1};
  p.a=1+(p.a-1)*.97;p.b=1+(p.b-1)*.97;
  if(a.liked||a.saved||sec>=exp*.6)p.a+=1;else if(sec<Math.min(3,exp*.3))p.b+=1;
  D.hist=(D.hist||[]).concat((a.tpn||0)*100/wc).slice(-5);
  if(D.hist.length>=3){const m=D.hist.reduce((x,y)=>x+y,0)/D.hist.length;if(m>8)D.off=Math.max(-1,D.off-.34);else if(m<3)D.off=Math.min(1,D.off+.34)}
  save();
}
async function gem(prompt,max,temp){
  const c=D.cfg,models=[...new Set([c.model,c.model2].filter(Boolean))];
  let last=null,soon=0;
  for(const model of models){
    const until=D.out[model]||0;
    if(until>Date.now()){soon=soon?Math.min(soon,until):until;continue}
    for(let i=0;i<3;i++){
      try{
        const k=fd(new Date());D.calls[k]=(D.calls[k]||0)+1;const cm=D.cm[model]=D.cm[model]||{};cm[k]=(cm[k]||0)+1;save();eng();
        const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":c.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:temp,maxOutputTokens:max}})});
        const j=await res.json().catch(()=>({}));
        if(!res.ok){const e=new Error(j.error&&j.error.message||res.status);e.code=res.status;throw e}
        const txt=((j.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||"").join("");
        return JSON.parse(txt.replace(/```json|```/g,"").trim());
      }catch(e){
        last=e;
        if(isQuota(e)){
          const m=e.message.match(/retry in (?:(\d+)h)?(?:(\d+)m)?([\d.]+)s/);
          const ms=m?((+m[1]||0)*3600+(+m[2]||0)*60+parseFloat(m[3]))*1000:6*36e5;
          D.out[model]=Date.now()+ms;soon=soon?Math.min(soon,D.out[model]):D.out[model];save();break;
        }
        const busy=[429,500,502,503,504].includes(e.code)||/high demand|overloaded|unavailable/i.test(e.message||"");
        e.transient=busy;
        if(!busy||i===2)break;
        say("Gemini 忙碌，自動重試中（"+(i+1)+"/2）…");
        await new Promise(r=>setTimeout(r,1500*2**i));
      }
    }
  }
  if(soon&&(!last||isQuota(last)))throw Object.assign(new Error("今日免費額度已用完，約 "+fmtWait(soon-Date.now())+" 後恢復。可到設定換另一個模型，或開啟 Google 計費。"),{quota:true});
  throw last||new Error("沒有可用的模型");
}
const toks=t=>[...new Set((t.match(/[A-Za-z]+(?:['’][A-Za-z]+)*/g)||[]).map(w=>w.toLowerCase().replace("’","'")))];
function look(a,w){
  for(const k of [w,w.replace(/'s$/,""),w.replace(/(es|s)$/,""),w.replace(/s$/,""),w.replace(/ed$/,""),w.replace(/ing$/,"")]){
    const r=a.words[k];
    if(typeof r==="string"&&r.includes("|")&&r.split("|").slice(1).join("|").trim())return r;
  }
  return null;
}
async function askWords(a,ws){
  const o=await gem("Article:\n"+a.text+"\n\nFor each word below, give its part of speech and its Traditional Chinese (Taiwan usage) meaning as used in this article. Return ONLY JSON like {\"word\":\"n.|意思\"} using exactly these keys: "+ws.join(", "),2048,.2);
  for(const k in o){if(typeof o[k]==="string"&&o[k].includes("|"))a.words[k.toLowerCase().replace("’","'")]=o[k]}
  save();
}
async function gen(){
  const c=D.cfg;
  if(busy)return;
  if(!c.key){say("請先填入 Gemini API 金鑰");panel("pset");return}
  busy=true;failed=false;say("生成中…");
  try{
    if(!SRC.length)throw new Error("還沒有讀到資料（sources.json）");
    const s=pickSrc(c.topics.length?c.topics:TOPICS);
    if(!s)throw new Error("這些主題暫時沒有新資料了，晚點再來");
    const targets=pick(5);
    const prompt=`You write short English reading passages for a Taiwanese junior/senior-high learner, based ONLY on a real source.
SOURCE (${s.source}, ${s.date?s.date.slice(0,10):"background knowledge"}):
Title: ${s.title}
Text: ${s.text}

Fact rules: use ONLY facts stated in SOURCE. Do not add numbers, names, dates, quotes or claims that are not in SOURCE. If SOURCE is thin, write fewer sentences instead of inventing. Do not present opinions as facts. Never use direct quotations; paraphrase and attribute statements (for example, "he said").
Target words (use each naturally at least once, inflect only if needed; skip a word if it cannot fit the facts naturally): ${targets.map(w=>mean(w)?w+" (meaning: "+mean(w)+")":w).join(", ")}
Length: about ${LN[c.len]} words.
Level: ${LV[effLv()]}
Style: retell the facts in clear, simple, school-textbook sentence patterns. Replace hard terms with simple descriptions but keep proper names. No slang, no fragments. Contractions are fine.
Return ONLY JSON:
{"title_en":"","title_zh":"Traditional Chinese, Taiwan usage","article":"","examples":{"<target word used>":["<short example sentence in a different context>","<another>"]},"targets_used":{"<base target word>":"<lowercase form used in the article>"},"words":{"<every distinct lowercase word in the article, including targets>":"<part of speech like n./v./adj./adv./prep./conj./pron./aux./art.>|<Traditional Chinese meaning in this context, 2-8 characters>"}}`;
    const o=await gem(prompt,4096,.7);
    if(!o.article||!o.words)throw new Error("模型回傳格式不完整");
    const words={};for(const k in o.words)words[k.toLowerCase().replace("’","'")]=o.words[k];
    const a={id:Date.now(),topic:s.topic,te:o.title_en||s.title,tz:o.title_zh||"",text:o.article,words,tmap:o.targets_used||{},ex:o.examples||{},liked:false,saved:false,dwell:0,sid:s.id,lic:s.lic||"",sname:s.source,surl:s.url,sdate:s.date};
    for(const k in a.ex)if(Array.isArray(a.ex[k]))D.ex[k.toLowerCase()]=a.ex[k].slice(0,2).map(String);D.used.push(s.id);D.articles.push(a);save();add(a,D.articles.length-1);say("");
  }catch(e){failed=true;say(e.quota?e.message:"生成失敗："+e.message);if(e.transient)setTimeout(()=>{failed=false;refill()},60000)}
  busy=false;refill();
}
function refill(){
  const unread=D.articles.length-(cur<0?D.articles.length:cur+1);
  if(D.cfg.key&&SRC.length&&!busy&&!failed&&unread<1)gen();
}

function body(a){
  const f=document.createDocumentFragment(),tg=new Set(Object.values(a.tmap||{}).map(x=>String(x).toLowerCase()));
  sents(a.text).forEach((s,i)=>{let last=0;
    s.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g,(m,off)=>{
      f.append(s.slice(last,off));
      const w=m.toLowerCase().replace("’","'"),sp=h("span",{className:"w"+(tg.has(w)?" t":""),textContent:m,tabIndex:0});
      sp.dataset.w=w;sp.dataset.s=i;f.append(sp);last=off+m.length;return m});
    f.append(s.slice(last)+" ")});
  return f;
}
function add(a,i){
  const lk=h("button",{textContent:a.liked?"♥ 已讚":"♡ 讚",className:a.liked?"on":""}),sv=h("button",{textContent:a.saved?"★ 已收藏":"☆ 收藏",className:a.saved?"on":""});
  lk.onclick=()=>{a.liked=!a.liked;lk.textContent=a.liked?"♥ 已讚":"♡ 讚";lk.className=a.liked?"on":"";save()};
  sv.onclick=()=>{a.saved=!a.saved;sv.textContent=a.saved?"★ 已收藏":"☆ 收藏";sv.className=a.saved?"on":"";save()};
  const fresh=a.sdate&&Date.now()-Date.parse(a.sdate)<864e5;
  const meta=h("p",{className:"meta"},fresh?h("span",{className:"new",textContent:"新"}):"",h("span",{textContent:a.topic+" · "+(a.sname||"")+" · "+(a.sdate?ago(a.sdate):"背景知識")+(a.lic?" · "+a.lic:"")}));
  const act=h("div",{className:"act"},lk,sv);
  if(/^https?:\/\//.test(a.surl||""))act.append(h("a",{href:a.surl,target:"_blank",rel:"noopener",textContent:"看原文"}));
  const s=h("section",{},h("h2",{textContent:a.te}),h("p",{className:"zh",textContent:a.tz}),meta,h("div",{className:"body"},body(a)),act);
  s.dataset.i=i;feed.insertBefore(s,$("more"));io.observe(s);
}
function leave(){
  const a=D.articles[cur];
  if(a&&a.t0){a.dwell=(a.dwell||0)+Math.round((Date.now()-a.t0)/1000);a.t0=0;save();finish(a)}
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;
  leave();hideSheet();
  if(e.target.id==="more"){cur=-1;D.pos="more";save()}
  else{
    cur=+e.target.dataset.i;const a=D.articles[cur];a.t0=Date.now();if(D.pos!==a.id){D.pos=a.id;save()}
    if(!a.seen){a.seen=1;a.sa=Date.now();const k=fd(new Date());D.days[k]=(D.days[k]||0)+1;Object.keys(a.tmap||{}).forEach(b=>{(D.state[b]=D.state[b]||{shown:0,taps:0}).shown++});save();eng()}
  }
  refill();
}),{root:feed,rootMargin:"-45% 0px -45% 0px",threshold:0});
io.observe($("more"));
document.addEventListener("visibilitychange",()=>{if(document.hidden)leave()});

function keepVisible(el){
  feed.classList.add("pin");
  requestAnimationFrame(()=>{
    const f=feed.getBoundingClientRect(),r=el.getBoundingClientRect();
    if(r.bottom>f.bottom-14)feed.scrollTop+=r.bottom-f.bottom+14;
    else if(r.top<f.top+8)feed.scrollTop-=f.top+8-r.top;
  });
}
function hideSheet(){$("sheet").hidden=true;feed.classList.remove("pin");document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"))}
let tapN=0;
async function tap(el){
  const id=++tapN,a=D.articles[+el.closest("section").dataset.i],w=el.dataset.w;
  const t=el.classList.contains("t"),base=Object.keys(a.tmap||{}).find(k=>String(a.tmap[k]).toLowerCase()===w)||w;
  (D.state[base]=D.state[base]||{shown:0,taps:0}).taps++;D.state[base].miss=0;(a.tp=a.tp||[]).push(base);if(!t)a.tpn=(a.tpn||0)+1;
  hideSheet();el.classList.add("on");
  $("sw").textContent=el.textContent;$("stg").textContent=t?"目標單字":"非目標單字";$("stg").className="tag"+(t?" t":"");
  let raw=look(a,w);
  $("sm").textContent=raw?"":"查詢中…";$("sheet").hidden=false;keepVisible(el);
  if(!raw){try{await askWords(a,toks(a.text).filter(x=>!look(a,x)));raw=look(a,w)}catch(e){}}
  const x=raw?raw.split("|"):["",""],pos=x[0],m=x.slice(1).join("|");
  if(id===tapN)$("sm").textContent=raw?(m?pos+" "+m:pos):"查不到，請再點一次重試";
  D.taps.push({w,pos,m,target:t,art:a.id,sent:sents(a.text)[+el.dataset.s],at:Date.now(),sec:a.t0?Math.round((Date.now()-a.t0)/1000):0});save();
}
feed.addEventListener("click",e=>{const el=e.target.closest(".w");el?tap(el):hideSheet()});
feed.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("w")){e.preventDefault();tap(e.target)}});
$("cl").onclick=hideSheet;$("gb").onclick=()=>{failed=false;gen()};

function panel(id){["pset","pvoc","pinfo","pimp"].forEach(p=>$(p).hidden=p!==id);if(id==="pset")drawSet();if(id==="pvoc")drawVoc();if(id==="pinfo")drawInfo();if(id==="pimp")drawImp()}
function drawSet(){
  $("ck").value=D.cfg.key;$("cm").value=D.cfg.model;$("cst").value=D.cfg.strict?1:0;$("cm2").value=D.cfg.model2||"";$("climit").value=D.cfg.limit||"";$("cd").value=D.cfg.level;$("cg").value=D.cfg.len;
  const all=[...new Set([...TOPICS,...SRC.map(s=>s.topic),...D.cfg.topics])];
  $("ct").replaceChildren(...all.map(t=>{
    const b=h("button",{textContent:t,className:D.cfg.topics.includes(t)?"on":""});
    b.onclick=()=>{const k=D.cfg.topics;k.includes(t)?k.splice(k.indexOf(t),1):k.push(t);b.className=k.includes(t)?"on":""};return b}));
}
$("cs").onclick=()=>{D.cfg.key=$("ck").value.trim();D.cfg.model=$("cm").value.trim()||"gemini-3.5-flash-lite";D.cfg.model2=$("cm2").value.trim();D.cfg.limit=+$("climit").value||0;D.cfg.strict=+$("cst").value;D.cfg.level=+$("cd").value;D.cfg.len=+$("cg").value;save();panel(null);failed=false;refill()};
function drawInfo(){
  const m={};SRC.forEach(s=>{const x=m[s.source]=m[s.source]||{n:0,lic:s.lic||"授權未確認",ok:s.ok!==false,t:s.topic};x.n++});
  $("il").replaceChildren(...Object.entries(m).map(([k,x])=>h("div",{className:"vr"},h("b",{textContent:k,style:"min-width:120px;font-size:14px"}),h("span",{textContent:x.t+" · "+x.lic+(x.ok?"":"（預設不顯示）")}),h("span",{textContent:x.n+" 則",style:"flex:none"}))));
}
function drawVoc(){
  const f=$("vf").value,names={new:"新字",learning:"學習中",familiar:"熟悉",mastered:"已掌握",known:"已會",ignore:"不想學"};
  const pool=new Set(cands().map(x=>x.w)),tp={};D.taps.forEach(t=>{tp[t.w]=t});
  const ws=[...new Set([...Object.keys(D.state),...Object.keys(D.flags),...Object.keys(tp)])];
  const rows=ws.map(w=>({w,s:D.flags[w]||stat(w)})).filter(x=>f==="all"||x.s===f).sort((a,b)=>((D.state[b.w]||{}).taps||0)-((D.state[a.w]||{}).taps||0)).slice(0,200);
  $("vs").textContent="可選單字 "+pool.size+" 個；目前等級上限 Level "+cap()+"（會依你的點擊自動微調）；已讀 "+D.articles.filter(a=>a.seen).length+" 篇；點擊 "+D.taps.length+" 次。";
  $("vl").replaceChildren(...rows.map(({w,s})=>{
    const t=tp[w],ex=(D.ex[w]||[])[0];
    const r=h("div",{className:"vr"},h("b",{textContent:w}),h("span",{textContent:names[s]+(t?" · "+t.pos+" "+(t.m||""):"")+(ex?"　例：“"+ex+"”":"")}));
    const b=h("button",{textContent:D.flags[w]?"還原":"已會"});
    b.onclick=()=>{if(D.flags[w])delete D.flags[w];else D.flags[w]="known";save();drawVoc()};r.append(b);
    if(!D.flags[w]){const n=h("button",{textContent:"不想學"});n.onclick=()=>{D.flags[w]="ignore";save();drawVoc()};r.append(n)}
    if(!pool.has(w)&&!D.flags[w]){const a=h("button",{textContent:"加入"});a.onclick=()=>{D.extra.push(w);save();drawVoc()};r.append(a)}
    return r}));
}

const FNP=new Set("art pron prep conj aux".split(" ")),NUM={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6};
function parseWords(t){
  const out=[],add=(w,m)=>{w=w.toLowerCase().replace("’","'");if(/^[a-z][a-z'-]+$/.test(w)&&!out.some(x=>x.w===w))out.push({w,m})};
  const official=/第[一二三四五六]級/.test(t);
  t.split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line||/^第[一二三四五六]級$/.test(line))return;
    if(official){
      const m=line.match(/^(.+?)\s+((?:n|v|adj|adv|prep|conj|pron|art|aux)\.?[\w./()]*)$/);if(!m)return;
      const pos=m[2].split(/[\/()]+/).map(x=>x.replace(".","")).filter(Boolean);
      if(pos.length&&pos.every(p=>FNP.has(p)))return;
      m[1].split("/").forEach(v=>{const b=v.replace(/\(.*?\)/g,"").trim();add(b,"");const f=v.match(/\((\w{1,4})\)/);if(f&&!/\s/.test(b))add(b+f[1],"")});return;
    }
    const p=line.match(/^([A-Za-z][A-Za-z'’-]*)\s*[,;:=\t]\s*([^A-Za-z].*)$/);
    if(p){add(p[1],p[2].trim());return}
    (line.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).forEach(w=>add(w,""));
  });
  return out;
}
let impWords=[];
function drawImp(){
  $("impList").replaceChildren(...D.lists.map(l=>{
    const r=h("div",{className:"vr"},h("b",{textContent:l.name,style:"min-width:120px;font-size:14px"}),h("span",{textContent:l.words.length+" 字"}));
    const t=h("button",{textContent:l.on?"停用":"啟用"});t.onclick=()=>{l.on=!l.on;save();drawImp()};
    const d=h("button",{textContent:"刪除"});d.onclick=()=>{D.lists=D.lists.filter(x=>x!==l);save();drawImp()};
    r.append(t,d);return r}));
}
$("impPv").onclick=()=>{
  impWords=parseWords($("impText").value);const ex=new Set(cands().map(x=>x.w));
  $("impPrev").textContent="辨識到 "+impWords.length+" 個單字，其中 "+impWords.filter(x=>ex.has(x.w)).length+" 個已在單字池。前 12 個："+impWords.slice(0,12).map(x=>x.w).join("、");
};
$("impFile").onchange=async e=>{const f=e.target.files[0];if(f)$("impText").value=await f.text()};
$("impOk").onclick=()=>{
  if(!impWords.length)$("impPv").onclick();
  const ws=impWords;if(!ws.length)return;
  const dest=$("impDest").value;
  if(dest==="learning")D.lists.push({id:Date.now(),name:$("impName").value.trim()||"匯入清單",on:true,words:ws.map(x=>({w:x.w,m:x.m}))});
  else ws.forEach(x=>{D.flags[x.w]=dest});
  save();$("impText").value="";impWords=[];$("impPrev").textContent="已匯入 "+ws.length+" 個單字";drawImp();
};
$("impX").onclick=()=>panel("pvoc");$("vi").onclick=()=>panel("pimp");$("vf").onchange=drawVoc;
$("va").onclick=()=>{const v=$("vn").value.trim().toLowerCase();if(/^[a-z]+$/.test(v)&&!BASE.includes(v)&&!D.extra.includes(v)){D.extra.push(v);save();$("vn").value="";drawVoc()}};
$("ve").onclick=async()=>{const t=JSON.stringify(D.taps,null,1);$("vj").hidden=false;$("vj").value=t;try{await navigator.clipboard.writeText(t);$("ve").textContent="已複製"}catch(e){$("vj").select()}};
$("vx").onclick=()=>{if(confirm("確定清空所有文章、單字狀態與點擊紀錄？（設定會保留）")){D.articles=[];D.state={};D.extra=[];D.taps=[];D.used=[];D.days={};save();location.reload()}};
$("vc").onclick=()=>panel(null);$("bv").onclick=()=>panel("pvoc");$("bi").onclick=()=>panel("pinfo");$("ic").onclick=()=>panel(null);$("bs").onclick=()=>panel("pset");

const WIN=30,pi=D.articles.findIndex(a=>a.id===D.pos);
const st0=Math.max(0,Math.min(D.articles.length-WIN,pi<0?D.articles.length:pi));

function drawStat(){
  const today=fd(new Date()),now=Date.now(),DAY=864e5;
  const dw=a=>(a.dwell||0)+(a.t0?Math.round((now-a.t0)/1000):0);
  const fm=s=>s>=60?Math.floor(s/60)+" 分 "+(s%60)+" 秒":s+" 秒";
  const pc=x=>(x*100).toFixed(1)+"%",avg=(arr,k)=>arr.length?arr.reduce((s,x)=>s+x[k],0)/arr.length:0;
  const st=D.articles.filter(a=>a.sa&&fd(new Date(a.sa))===today);
  const tot=st.reduce((s,a)=>s+dw(a),0);
  const ratio=st.map(a=>{const all=toks(a.text).length||1,t=D.taps.filter(x=>x.art===a.id);return{all:new Set(t.map(x=>x.w)).size/all,tg:new Set(t.filter(x=>x.target).map(x=>x.w)).size/all}});
  const tw={};D.taps.filter(t=>fd(new Date(t.at))===today).forEach(t=>{tw[t.w]=(tw[t.w]||0)+1});
  const topw=Object.entries(tw).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([w,c])=>w+" ×"+c).join("、")||"—";
  const cnt={};cands().forEach(x=>{const s=stat(x.w);cnt[s]=(cnt[s]||0)+1});
  const score=a=>{const wc=toks(a.text).length||60,exp=Math.max(8,wc/2.5),s=dw(a);return a.liked||a.saved?1:s>=exp*.6?.6:s<Math.min(3,exp*.3)?0:.3};
  const by={};D.articles.filter(a=>a.seen&&a.sa&&now-a.sa<7*DAY).forEach(a=>{(by[a.topic]=by[a.topic]||[]).push(score(a))});
  const tops=Object.entries(by).filter(([t,v])=>v.length>=2).map(([t,v])=>[t,v.reduce((a,b)=>a+b,0)/v.length,v.length]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,s,n])=>t+" "+Math.round(s*100)+"%（"+n+" 篇）").join(" · ")||"資料還不夠（每個主題至少讀 2 篇）";
  const hs=D.hist||[],hm=hs.length?(hs.reduce((a,b)=>a+b,0)/hs.length).toFixed(1):"—";
  const rem={};SRC.filter(s=>!D.used.includes(s.id)&&(!+D.cfg.strict||s.ok!==false)).forEach(s=>{rem[s.topic]=(rem[s.topic]||0)+1});
  const outs=Object.entries(D.out).filter(([m,u])=>u>now).map(([m,u])=>m+" 約 "+fmtWait(u-now)+" 後恢復").join("；")||"無";
  const per=Object.entries(D.cm).map(([m,c])=>m+" "+(c[today]||0)).join("、");
  const sec=(t,rows)=>[h("div",{className:"sh",textContent:t}),...rows.map(([k,v])=>h("div",{className:"sr"},h("span",{textContent:k}),h("b",{textContent:v})))];
  $("sg").replaceChildren(
    ...sec("今天",[["閱讀篇數",(D.days[today]||0)+" 篇"],["停留時間",st.length?fm(tot)+"（平均 "+fm(Math.round(tot/st.length))+"）":"—"],["API 呼叫",(D.calls[today]||0)+(D.cfg.limit?" / "+D.cfg.limit:"")+" 次"],["各模型",per||"—"]]),
    ...sec("單字",[["平均每篇被點比例",ratio.length?pc(avg(ratio,"all"))+"（目標 "+pc(avg(ratio,"tg"))+"、非目標 "+pc(avg(ratio,"all")-avg(ratio,"tg"))+"）":"—"],["今天最常點",topw],["單字狀態","新字 "+(cnt.new||0)+" · 學習中 "+(cnt.learning||0)+" · 熟悉 "+(cnt.familiar||0)+" · 已掌握 "+(cnt.mastered||0)]]),
    ...sec("興趣",[["近 7 天最感興趣",tops]]),
    ...sec("難度",[["等級上限","Level "+cap()+"（"+(D.off>.2?"已自動調高":D.off<-.2?"已自動調低":"維持原設定")+"）"],["最近每百字點擊",hm+" 個"]]),
    ...sec("系統",[["資料更新",UPD?ago(UPD):"—"],["各主題剩餘來源",Object.entries(rem).map(([t,c])=>t+" "+c).join(" · ")||"—"],["未讀庫存",(D.articles.length-(cur<0?D.articles.length:cur+1))+" 篇"],["額度狀態",outs]])
  );
}
$("eng").onclick=()=>{const s=$("stat");s.hidden=!s.hidden;$("eng").setAttribute("aria-expanded",String(!s.hidden));eng();if(!s.hidden)drawStat()};

D.articles.forEach((a,i)=>{if(i>=st0)add(a,i)});
function restore(){
  let el=null;
  if(D.pos==="more")el=$("more");
  else{const i=D.articles.findIndex(a=>a.id===D.pos),idx=i>=0?i:D.articles.length-1;el=feed.querySelector('section[data-i="'+idx+'"]')}
  if(el)feed.scrollTop=el.getBoundingClientRect().top-feed.getBoundingClientRect().top+feed.scrollTop;
}
restore();setTimeout(restore,300);
eng();
fetch("sources.json?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
  SRC=j.items||[];UPD=j.updated||"";drawHN(j.links||[]);
  if(!D.cfg.key)say("請先到設定填入 Gemini API 金鑰");else if(!SRC.length)say("資料庫還是空的，請先在 GitHub 手動執行一次更新");else{say("");refill()}
}).catch(()=>say("讀不到 sources.json（需和這個檔案放在同一個網站）"));
</script>
