<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的英文滑讀</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f9;--fg:#14202b;--muted:#5b6874;--card:#fff;--line:#dde4ea;--mark:#ffe27a;--markfg:#3b2f00;--acc:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--fg:#e8edf2;--muted:#9aa8b5;--card:#17222d;--line:#2a3846;--mark:#6b5600;--markfg:#fff3c4;--acc:#5eead4}}
:root[data-theme="dark"]{--bg:#0f1720;--fg:#e8edf2;--muted:#9aa8b5;--card:#17222d;--line:#2a3846;--mark:#6b5600;--markfg:#fff3c4;--acc:#5eead4}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;font-size:13px;color:var(--muted);flex:none}
header b{color:var(--fg);font-size:15px}
#feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
section{min-height:100%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:18px 22px;max-width:640px;margin:0 auto;box-sizing:border-box}
h2{font-family:Lora,Georgia,serif;font-size:24px;line-height:1.25;margin:0 0 4px}
.zh{color:var(--muted);font-size:16px;margin:0 0 8px}
.meta{font-size:12px;color:var(--muted);margin:0 0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.new{background:var(--acc);color:var(--bg);border-radius:99px;padding:1px 8px;font-weight:700}
.body{font-family:Lora,Georgia,serif;font-size:19px;line-height:1.85}
.w{cursor:pointer;border-radius:3px;padding:0 1px}
.w:hover,.w.on{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.w.t{background:var(--mark);color:var(--markfg)}
.act{margin-top:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
a{color:var(--acc)}
button,input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button{cursor:pointer}
button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible,.w:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.18);max-width:640px;margin:0 auto;border-radius:14px 14px 0 0}
.sheet[hidden],.full[hidden]{display:none}
#sw{font-family:Lora,Georgia,serif;font-size:26px;font-weight:600}
#sm{font-size:18px;margin:6px 0 10px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.t{background:var(--mark);color:var(--markfg);border-color:transparent}
.full{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 30px;z-index:5}
.full>div{max-width:560px;margin:0 auto}
.full label{display:block;margin:14px 0 4px;font-size:13px;color:var(--muted)}
.full input,.full select{width:100%;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.vr{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.vr b{font-family:Lora,Georgia,serif;font-size:16px;min-width:84px}
.vr span{flex:1;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
</style>
</head>
<body>
<header><b>我的英文滑讀</b><span id="st"></span><span><button id="bv">單字本</button> <button id="bs">設定</button></span></header>
<main id="feed"><section id="more"><h2>下一篇準備中</h2><p class="zh" id="mt">讀取最新資料中…</p><div class="row"><button id="gb">立即生成一篇</button></div><div id="hn" style="margin-top:18px"></div></section></main>
<footer><span id="eng"></span><span>上滑看下一篇，點單字看意思</span></footer>

<div id="sheet" class="sheet" hidden><div id="sw"></div><div id="sm"></div><span id="stg" class="tag"></span> <button id="cl" style="float:right">關閉</button></div>

<div id="pset" class="full" hidden><div>
  <h2>設定</h2>
  <label>Gemini API 金鑰（只存在這個瀏覽器）</label><input id="ck" type="password" autocomplete="off" placeholder="貼上金鑰">
  <label>模型名稱</label><input id="cm">
  <label>備用模型（主模型忙碌時改用，可留空）</label><input id="cm2">
  <label>想看的主題（可多選）</label><div class="chips" id="ct"></div>
  <label>難度</label><select id="cd"><option value="0">簡單</option><option value="1">普通</option><option value="2">挑戰</option></select>
  <label>文章長度</label><select id="cg"><option value="0">短（約 60 字）</option><option value="1">中（約 100 字）</option><option value="2">長（約 150 字）</option></select>
  <div class="row"><button id="cs" class="on">儲存並關閉</button></div>
</div></div>

<div id="pvoc" class="full" hidden><div>
  <h2>單字本</h2>
  <p id="vs" style="font-size:13px;color:var(--muted)"></p>
  <div class="row"><input id="vn" placeholder="新增想學的單字（英文）" style="flex:1"><button id="va">加入單字池</button></div>
  <div id="vl"></div>
  <div class="row"><button id="ve">複製點擊紀錄 JSON</button><button id="vx">清空全部資料</button><button id="vc" class="on">關閉</button></div>
  <textarea id="vj" readonly hidden style="width:100%;height:100px;margin-top:8px"></textarea>
</div></div>

<script>
const $=i=>document.getElementById(i);
const h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);k.flat().forEach(x=>e.append(x));return e};
const BASE="answer begin brave bridge careful choose clever collect dangerous decide defeat different early enemy escape explore famous finally follow future gather guide hidden honest important invite journey kind laugh lesson local mistake modern narrow notice offer ordinary perfect plan protect quiet reach reward safe search secret share simple special strange strong surprise travel useful village wander warn wonder worth".split(" ");
const TOPICS=["國際","科技","科技人物","遊戲版本","遊戲攻略","遊戲劇情"];
const LV=["very easy: sentences under 10 words, only the most basic vocabulary","easy: sentences mostly under 15 words","moderate: a mix of short and longer sentences, with a few when/if/that clauses"],LN=[60,100,150];
let D={articles:[],state:{},extra:[],taps:[],used:[],days:{},cfg:{key:"",model:"gemini-3.5-flash-lite",model2:"gemini-2.5-flash-lite",topics:["國際","科技"],level:1,len:1}};
try{const s=JSON.parse(localStorage.getItem("reel_v2"));if(s)D={...D,...s,cfg:{...D.cfg,...s.cfg}}}catch(e){}
const save=()=>{try{localStorage.setItem("reel_v2",JSON.stringify(D))}catch(e){}};
const feed=$("feed"),sents=t=>t.split(/(?<=[.!?])\s+/);
let SRC=[],busy=false,failed=false,cur=-1;
function drawHN(l){
  const box=$("hn");
  if(!l.length){box.replaceChildren();return}
  box.replaceChildren(
    h("p",{className:"meta",textContent:"今日科技圈在談什麼（Hacker News 熱門，僅列標題與連結）"}),
    ...l.map(x=>{
      const ok=/^https?:\/\//.test(x.url||"");
      return h("div",{className:"vr"},
        ok?h("a",{href:x.url,target:"_blank",rel:"noopener",textContent:x.title}):h("span",{textContent:x.title}),
        h("span",{textContent:x.score+" 分 · "+x.comments+" 則留言",style:"flex:none;font-size:12px"}));
    }));
}
const say=t=>{$("st").textContent=t;$("mt").textContent=t||"向上滑動看下一篇"};
const fd=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const ago=t=>{const m=(Date.now()-Date.parse(t))/6e4;return m<60?Math.max(1,Math.round(m))+" 分鐘前":m<1440?Math.round(m/60)+" 小時前":Math.round(m/1440)+" 天前"};
function eng(){
  let d=new Date();if(!D.days[fd(d)])d.setDate(d.getDate()-1);
  let n=0;while(D.days[fd(d)]){n++;d.setDate(d.getDate()-1)}
  $("eng").textContent=(n?"連續 "+n+" 天 · ":"")+"今日 "+(D.days[fd(new Date())]||0)+" 篇";
}

function pick(n){
  const items=[...new Set([...BASE,...D.extra])].map(w=>{const s=D.state[w]||{shown:0,taps:0};let k=(1/(1+s.shown))*(1+2*s.taps);if(s.shown>=6&&!s.taps)k*=.2;return{w,k}});
  const out=[];
  while(out.length<n&&items.length){let r=Math.random()*items.reduce((a,b)=>a+b.k,0),i=0;for(;i<items.length-1;i++){r-=items[i].k;if(r<=0)break}out.push(items.splice(i,1)[0].w)}
  return out;
}
function pickSrc(ts){
  const c=SRC.filter(s=>ts.includes(s.topic)&&!D.used.includes(s.id));
  if(!c.length)return null;
  const ws=c.map(s=>{
    const age=s.date?Math.max(0,(Date.now()-Date.parse(s.date))/864e5):3;
    return (1/(1+age))*(1+2*D.articles.filter(a=>a.topic===s.topic&&a.liked).length);
  });
  let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;for(;i<c.length-1;i++){r-=ws[i];if(r<=0)break}
  return c[i];
}

async function gem(prompt,max,temp){
  const c=D.cfg,models=[c.model,c.model2].filter(Boolean);
  let last;
  for(let i=0;i<4;i++){
    const model=models[i>=2&&models.length>1?1:0];
    let busy=false;
    try{
      const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":c.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:temp,maxOutputTokens:max}})});
      const j=await res.json().catch(()=>({}));
      if(!res.ok){const e=new Error(j.error&&j.error.message||res.status);e.code=res.status;throw e}
      const txt=((j.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||"").join("");
      return JSON.parse(txt.replace(/```json|```/g,"").trim());
    }catch(e){
      busy=[429,500,502,503,504].includes(e.code)||/high demand|overloaded|unavailable/i.test(e.message||"");
      e.transient=busy;last=e;
      if(!busy||i===3)break;
      say("Gemini 忙碌，自動重試中（"+(i+1)+"/3）…");
      await new Promise(r=>setTimeout(r,1500*2**i));
    }
  }
  throw last;
}
const toks=t=>[...new Set((t.match(/[A-Za-z]+(?:['’][A-Za-z]+)*/g)||[]).map(w=>w.toLowerCase().replace("’","'")))];
function look(a,w){
  for(const k of [w,w.replace(/'s$/,""),w.replace(/(es|s)$/,""),w.replace(/s$/,""),w.replace(/ed$/,""),w.replace(/ing$/,"")]){
    const r=a.words[k];
    if(typeof r==="string"&&r.includes("|")&&r.split("|").slice(1).join("|").trim())return r;
  }
  return null;
}
async function askWords(a,ws){
  const o=await gem("Article:\n"+a.text+"\n\nFor each word below, give its part of speech and its Traditional Chinese (Taiwan usage) meaning as used in this article. Return ONLY JSON like {\"word\":\"n.|意思\"} using exactly these keys: "+ws.join(", "),2048,.2);
  for(const k in o){if(typeof o[k]==="string"&&o[k].includes("|"))a.words[k.toLowerCase().replace("’","'")]=o[k]}
  save();
}
async function gen(){
  const c=D.cfg;
  if(busy)return;
  if(!c.key){say("請先填入 Gemini API 金鑰");panel("pset");return}
  busy=true;failed=false;say("生成中…");
  try{
    if(!SRC.length)throw new Error("還沒有讀到資料（sources.json）");
    const s=pickSrc(c.topics.length?c.topics:TOPICS);
    if(!s)throw new Error("這些主題暫時沒有新資料了，晚點再來");
    const targets=pick(5);
    const prompt=`You write short English reading passages for a Taiwanese junior/senior-high learner, based ONLY on a real source.
SOURCE (${s.source}, ${s.date?s.date.slice(0,10):"background knowledge"}):
Title: ${s.title}
Text: ${s.text}

Fact rules: use ONLY facts stated in SOURCE. Do not add numbers, names, dates, quotes or claims that are not in SOURCE. If SOURCE is thin, write fewer sentences instead of inventing. Do not present opinions as facts. Never use direct quotations; paraphrase and attribute statements (for example, "he said").
Target words (use each naturally at least once, inflect only if needed; skip a word if it cannot fit the facts naturally): ${targets.join(", ")}
Length: about ${LN[c.len]} words.
Level: ${LV[c.level]}
Style: retell the facts in clear, simple, school-textbook sentence patterns. Replace hard terms with simple descriptions but keep proper names. No slang, no fragments. Contractions are fine.
Return ONLY JSON:
{"title_en":"","title_zh":"Traditional Chinese, Taiwan usage","article":"","targets_used":{"<base target word>":"<lowercase form used in the article>"},"words":{"<every distinct lowercase word in the article, including targets>":"<part of speech like n./v./adj./adv./prep./conj./pron./aux./art.>|<Traditional Chinese meaning in this context, 2-8 characters>"}}`;
    const o=await gem(prompt,4096,.7);
    if(!o.article||!o.words)throw new Error("模型回傳格式不完整");
    const words={};for(const k in o.words)words[k.toLowerCase().replace("’","'")]=o.words[k];
    const a={id:Date.now(),topic:s.topic,te:o.title_en||s.title,tz:o.title_zh||"",text:o.article,words,tmap:o.targets_used||{},liked:false,saved:false,dwell:0,sid:s.id,sname:s.source,surl:s.url,sdate:s.date};
    D.used.push(s.id);D.articles.push(a);save();add(a,D.articles.length-1);say("");
    const miss=toks(a.text).filter(w=>!look(a,w));if(miss.length)askWords(a,miss).catch(()=>{});
  }catch(e){failed=true;say("生成失敗："+e.message);if(e.transient)setTimeout(()=>{failed=false;refill()},60000)}
  busy=false;refill();
}
function refill(){
  const unread=D.articles.length-(cur<0?D.articles.length:cur+1);
  if(D.cfg.key&&SRC.length&&!busy&&!failed&&unread<2)gen();
}

function body(a){
  const f=document.createDocumentFragment(),tg=new Set(Object.values(a.tmap||{}).map(x=>String(x).toLowerCase()));
  sents(a.text).forEach((s,i)=>{let last=0;
    s.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g,(m,off)=>{
      f.append(s.slice(last,off));
      const w=m.toLowerCase().replace("’","'"),sp=h("span",{className:"w"+(tg.has(w)?" t":""),textContent:m,tabIndex:0});
      sp.dataset.w=w;sp.dataset.s=i;f.append(sp);last=off+m.length;return m});
    f.append(s.slice(last)+" ")});
  return f;
}
function add(a,i){
  const lk=h("button",{textContent:a.liked?"♥ 已讚":"♡ 讚",className:a.liked?"on":""}),sv=h("button",{textContent:a.saved?"★ 已收藏":"☆ 收藏",className:a.saved?"on":""});
  lk.onclick=()=>{a.liked=!a.liked;lk.textContent=a.liked?"♥ 已讚":"♡ 讚";lk.className=a.liked?"on":"";save()};
  sv.onclick=()=>{a.saved=!a.saved;sv.textContent=a.saved?"★ 已收藏":"☆ 收藏";sv.className=a.saved?"on":"";save()};
  const fresh=a.sdate&&Date.now()-Date.parse(a.sdate)<864e5;
  const meta=h("p",{className:"meta"},fresh?h("span",{className:"new",textContent:"新"}):"",h("span",{textContent:a.topic+" · "+(a.sname||"")+" · "+(a.sdate?ago(a.sdate):"背景知識")}));
  const act=h("div",{className:"act"},lk,sv);
  if(/^https?:\/\//.test(a.surl||""))act.append(h("a",{href:a.surl,target:"_blank",rel:"noopener",textContent:"看原文"}));
  const s=h("section",{},h("h2",{textContent:a.te}),h("p",{className:"zh",textContent:a.tz}),meta,h("div",{className:"body"},body(a)),act);
  s.dataset.i=i;feed.insertBefore(s,$("more"));io.observe(s);
}
function leave(){
  const a=D.articles[cur];
  if(a&&a.t0){a.dwell=(a.dwell||0)+Math.round((Date.now()-a.t0)/1000);a.t0=0;save()}
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;
  leave();hideSheet();
  if(e.target.id==="more"){cur=-1}
  else{
    cur=+e.target.dataset.i;const a=D.articles[cur];a.t0=Date.now();
    if(!a.seen){a.seen=1;const k=fd(new Date());D.days[k]=(D.days[k]||0)+1;Object.keys(a.tmap||{}).forEach(b=>{(D.state[b]=D.state[b]||{shown:0,taps:0}).shown++});save();eng()}
  }
  refill();
}),{root:feed,threshold:.6});
io.observe($("more"));
document.addEventListener("visibilitychange",()=>{if(document.hidden)leave()});

function hideSheet(){$("sheet").hidden=true;document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"))}
let tapN=0;
async function tap(el){
  const id=++tapN,a=D.articles[+el.closest("section").dataset.i],w=el.dataset.w;
  const t=el.classList.contains("t"),base=Object.keys(a.tmap||{}).find(k=>String(a.tmap[k]).toLowerCase()===w)||w;
  (D.state[base]=D.state[base]||{shown:0,taps:0}).taps++;
  hideSheet();el.classList.add("on");
  $("sw").textContent=el.textContent;$("stg").textContent=t?"目標單字":"非目標單字";$("stg").className="tag"+(t?" t":"");
  let raw=look(a,w);
  $("sm").textContent=raw?"":"查詢中…";$("sheet").hidden=false;
  if(!raw){try{await askWords(a,[w]);raw=look(a,w)}catch(e){}}
  const x=raw?raw.split("|"):["",""],pos=x[0],m=x.slice(1).join("|");
  if(id===tapN)$("sm").textContent=raw?(m?pos+" "+m:pos):"查不到，請再點一次重試";
  D.taps.push({w,pos,m,target:t,art:a.id,sent:sents(a.text)[+el.dataset.s],at:Date.now(),sec:a.t0?Math.round((Date.now()-a.t0)/1000):0});save();
}
feed.addEventListener("click",e=>{const el=e.target.closest(".w");el?tap(el):hideSheet()});
feed.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("w")){e.preventDefault();tap(e.target)}});
$("cl").onclick=hideSheet;$("gb").onclick=()=>{failed=false;gen()};

function panel(id){["pset","pvoc"].forEach(p=>$(p).hidden=p!==id);if(id==="pset")drawSet();if(id==="pvoc")drawVoc()}
function drawSet(){
  $("ck").value=D.cfg.key;$("cm").value=D.cfg.model;$("cm2").value=D.cfg.model2||"";$("cd").value=D.cfg.level;$("cg").value=D.cfg.len;
  const all=[...new Set([...TOPICS,...SRC.map(s=>s.topic),...D.cfg.topics])];
  $("ct").replaceChildren(...all.map(t=>{
    const b=h("button",{textContent:t,className:D.cfg.topics.includes(t)?"on":""});
    b.onclick=()=>{const k=D.cfg.topics;k.includes(t)?k.splice(k.indexOf(t),1):k.push(t);b.className=k.includes(t)?"on":""};return b}));
}
$("cs").onclick=()=>{D.cfg.key=$("ck").value.trim();D.cfg.model=$("cm").value.trim()||"gemini-3.5-flash-lite";D.cfg.model2=$("cm2").value.trim();D.cfg.level=+$("cd").value;D.cfg.len=+$("cg").value;save();panel(null);failed=false;refill()};
function drawVoc(){
  const m={};D.taps.forEach(t=>{const x=m[t.w]=m[t.w]||{n:0,pos:t.pos,m:t.m,t:t.target};x.n++});
  const pool=new Set([...BASE,...D.extra]),rows=Object.entries(m).sort((a,b)=>b[1].n-a[1].n);
  $("vs").textContent="單字池 "+pool.size+" 字；已讀 "+D.articles.filter(a=>a.seen).length+" 篇；點擊 "+D.taps.length+" 次。下方是你點過的字，次數越多代表越需要複習。";
  $("vl").replaceChildren(...rows.map(([w,x])=>{
    const r=h("div",{className:"vr"},h("b",{textContent:w}),h("span",{textContent:x.pos+" "+(x.m||"")+(x.t?"":"（非目標）")}),h("span",{textContent:"×"+x.n,style:"flex:none"}));
    if(!pool.has(w)){const b=h("button",{textContent:"加入"});b.onclick=()=>{D.extra.push(w);save();drawVoc()};r.append(b)}
    return r}));
}
$("va").onclick=()=>{const v=$("vn").value.trim().toLowerCase();if(/^[a-z]+$/.test(v)&&!BASE.includes(v)&&!D.extra.includes(v)){D.extra.push(v);save();$("vn").value="";drawVoc()}};
$("ve").onclick=async()=>{const t=JSON.stringify(D.taps,null,1);$("vj").hidden=false;$("vj").value=t;try{await navigator.clipboard.writeText(t);$("ve").textContent="已複製"}catch(e){$("vj").select()}};
$("vx").onclick=()=>{if(confirm("確定清空所有文章、單字狀態與點擊紀錄？（設定會保留）")){D.articles=[];D.state={};D.extra=[];D.taps=[];D.used=[];D.days={};save();location.reload()}};
$("vc").onclick=()=>panel(null);$("bv").onclick=()=>panel("pvoc");$("bs").onclick=()=>panel("pset");

D.articles.forEach((a,i)=>add(a,i));
eng();
fetch("sources.json?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
  SRC=j.items||[];drawHN(j.links||[]);
  if(!D.cfg.key)say("請先到設定填入 Gemini API 金鑰");else if(!SRC.length)say("資料庫還是空的，請先在 GitHub 手動執行一次更新");else{say("");refill()}
}).catch(()=>say("讀不到 sources.json（需和這個檔案放在同一個網站）"));
</script>
</body>
