name: update-sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch sources
        run: node scripts/fetch.mjs
      - name: Commit changes
        run: |
          git config user.name "sources-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sources.json
          git diff --cached --quiet || (git commit -m "update sources" && git push)
